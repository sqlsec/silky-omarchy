# silky-dock-glass: macOS 26/27 Liquid Glass for MacShell, drawn by Hyprland (see docs/02-macshell.md).
# Installed to ~/.config/silky-omarchy/dock-glass.conf. The plugin re-reads this file within a second of saving it,
# no reload needed. Delete a line to get its built-in default (the values below).

# ── Dock (kind = 0) ──
# Physical Convex Squircle bezel + Snell's Law inward refraction (IOR 1.50).
blur = 6.5
tint = 0.10
tint_dark = 0.22
bezel = 14
thickness = 22
dispersion = 0.08
magnify = 0
saturation = 1.12
lift = 0.012
rim = 0.72

# ── Menus, Notification Center, Spotlight & Overlays (kind = 1) ──
# Control Center optics, with slightly more blur and tint for dense text.
menu_blur = 7.5
menu_tint = 0.11
menu_tint_dark = 0.20
menu_bezel = 14
menu_thickness = 24
menu_dispersion = 0.09
menu_magnify = 0
menu_saturation = 1.22
menu_lift = 0.018
menu_rim = 0.88

# ── Control Center floating bubbles (kind = 2) ──
# Clear jewel-like macOS 27 tiles: inward Snell bevel refraction, crisp 360° hairline rim, vivid backdrop.
cc_blur = 5.5
cc_tint = 0.09
cc_tint_dark = 0.18
cc_bezel = 14
cc_thickness = 24
cc_dispersion = 0.09
cc_magnify = 0
cc_saturation = 1.22
cc_lift = 0.018
cc_rim = 0.88

# ── Floating glass windows (About Omarchy Linux, RENDER_PRE_WINDOW) ──
# Half-resolution mipmap backdrop blur with 8-tap Vogel disk sampling (zero multi-pass Kawase overhead).
win_blur = 20.0
win_saturation = 1.15
win_contrast = 1.04
win_brightness = 1.00
