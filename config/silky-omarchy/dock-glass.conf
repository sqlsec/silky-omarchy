# silky-dock-glass: Liquid Glass of the MacShell Dock, drawn by Hyprland (see docs/02-macshell.md).
# Installed to ~/.config/silky-omarchy/dock-glass.conf. The plugin re-reads this file within a second of saving it,
# no reload needed. Delete a line to get its built-in default (the values below).

# How frosted the glass is: blur radius in logical px. macOS 27's Dock is clear glass: keep it small.
blur = 6
# Tint toward white in light mode, 0..1. Lower = more see-through.
tint = 0.10
# Tint toward dark grey in dark mode, 0..1 (a little deeper than light mode, like macOS dark glass).
tint_dark = 0.22
# Width of the bending rim, logical px (capped at 60 % of the half height). Only this band distorts; the middle
# of the Dock is flat glass that only blurs.
bezel = 14
# Strength of the lensing rim. The background stays continuous across the edge and is stretched across the bevel
# (peak shift = 0.32 x this, at most 30 % of the bevel width so it never folds). Negative = stretch the other way.
thickness = 20
# Colour fringes at the rim (0 = none).
dispersion = 0.06
# Vertical lens of the whole slab (0 = none). It tilts straight lines that cross the Dock, so it is off.
magnify = 0
# Saturation of what shows through (1 = unchanged).
saturation = 1.05
# Brightness added to the glass (and the light from above).
lift = 0.015
# Edge light strength (1 = MacShell's dockglass.frag default).
rim = 1.2
