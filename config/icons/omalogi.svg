<svg xmlns="http://www.w3.org/2000/svg" width="446" height="446" viewBox="-2 -2 446 446">
  <!-- Omalogi app icon (Silky Omarchy): white gaming mouse on a Logitech cyan-blue MacTahoe tile.
       Full-bleed square; scripts/tune-app-icons.py rounds it and adds the MacTahoe shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd4ff"/>
      <stop offset="1" stop-color="#1c63f2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5d9e0"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="0.35" stop-color="#2f7bff"/>
      <stop offset="0.7" stop-color="#a24bff"/>
      <stop offset="1" stop-color="#ff4fa8"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="442" height="442" fill="url(#bg)"/>
  <g filter="url(#drop)" transform="translate(221 224) scale(0.96) translate(-221 -222)">
    <!-- body: two button tips at the front, tapered waist, thumb rest flaring left -->
    <path fill="url(#body)" d="
      M221 58
      C262 58 300 70 308 130
      L316 236
      C322 330 284 386 221 386
      C158 386 120 330 126 236
      C116 222 106 206 108 186
      C110 168 122 156 130 150
      L134 130
      C142 70 180 58 221 58 Z"/>
    <path d="M221 62 V178" stroke="#a3a9b4" stroke-width="5" stroke-linecap="round"/>
    <path d="M136 152 C158 170 190 178 221 178 C252 178 284 170 306 152" fill="none" stroke="#bcc1ca" stroke-width="4" stroke-linecap="round"/>
    <rect x="208" y="88" width="26" height="60" rx="13" fill="#2a2d35"/>
    <rect x="215" y="98" width="12" height="40" rx="6" fill="#505668"/>
    <rect x="152" y="98" width="13" height="28" rx="6.5" fill="#c6cbd3"/>
    <rect x="152" y="132" width="13" height="20" rx="6.5" fill="#c6cbd3"/>
    <path d="M170 296 C192 318 250 318 272 296" fill="none" stroke="url(#rgb)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
