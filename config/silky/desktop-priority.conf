# Silky Omarchy desktop priority (installed to /etc/silky/desktop-priority.conf)
# Restart after edits: sudo systemctl restart silky-desktop-priority.service

[general]
# Seconds between scans for new desktop threads.
interval = 2
# Only boost processes owned by regular users.
min_uid = 1000

[targets]
# process name (comm, max 15 chars) = nice  uclamp.min (0-1024)
# nice: lower wins CPU contention. uclamp.min: schedutil frequency floor
# while the thread runs (512 ≈ half of max clock), so frames start fast.
Hyprland = -11 512
Xwayland = -6 256
qs = -8 384
quickshell = -8 384
fcitx5 = -6 256

[gpu]
# Minimum Adreno clock while on AC power, in MHz (0 disables). On battery
# the original floor is restored.
ac_min_freq_mhz = 550
