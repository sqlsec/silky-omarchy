# Prevent back-to-back MAC flips (real -> random scan MAC -> real MAC within ~70 ms)
# on Qualcomm WCN7850 (ath12k_wifi7_pci). Rapid MAC changes tear down and recreate
# the vdev, restart firmware 11d/regulatory updates, and collide with association
# scans ("received scan start failure event"), leaving 5 GHz scanning dead until
# the PCIe firmware is reloaded.
[device-silky-ath12k-scan-mac]
match-device=driver:ath12k_wifi7_pci
wifi.scan-rand-mac-address=no
